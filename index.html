<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juanes’s Topics</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0D304E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Juanes’s Topics">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Handlee&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF1EB;--ink:#0D304E;--txt:#1B3550;--muted:#4F6270;--card:#F7FAF7;--sun:#DA7828;--wind:#2F7D3A;--line:#C6D6C8;--ok:#2E7D4F;--bad:#B3402F}
:root[data-theme=dark]{--bg:#0F1A26;--ink:#E8EEF4;--txt:#CFDAE3;--muted:#8FA3B5;--card:#16222F;--sun:#F08A3C;--wind:#6FBF73;--line:#2A3A4A;--ok:#6FBF73;--bad:#E27C6B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:18px/1.75 "Source Serif 4",Georgia,serif;padding-bottom:150px}
h1,h2,button,summary,.ui{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
button{cursor:pointer;color:inherit}
button:focus-visible,summary:focus-visible,.w:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.logo{border-radius:50%;flex:none}
.brand{display:flex;align-items:center;gap:10px;flex:1;font:400 1.35rem/1.2 "Lucida Handwriting","Handlee","Segoe Script",cursive;color:var(--ink);white-space:nowrap}
.pick{max-width:700px;margin:0 auto;padding:12px 18px 0;display:grid;gap:8px}
#topics,#others{position:relative;min-width:0}
summary{list-style:none;cursor:pointer;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾"}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:60vh;overflow:auto;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.grp{margin:6px 6px 4px;font:700 .8rem "Bricolage Grotesque",sans-serif;color:var(--muted)}
.topic{display:block;width:100%;text-align:left;margin:0 0 4px;padding:10px 12px;border:0;border-radius:8px;background:transparent;font-size:.95rem;font-weight:600}
.topic small{display:block;font-weight:500;color:var(--muted);font-size:.78rem;margin-top:2px}
.topic:hover,.topic[aria-current=true]{background:var(--bg)}
#theme{border:1px solid var(--line);background:var(--card);border-radius:8px;width:42px;height:40px;font-size:1.1rem}
h1::after{content:"";display:block;width:56px;height:4px;border-radius:2px;background:var(--sun);margin-top:10px}
main{max-width:700px;margin:0 auto;padding:20px 18px}
h1{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.12;margin:6px 0 18px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
h2{font-size:1.25rem;margin:0 0 10px;color:var(--ink)}
#text p{margin:0 0 1.1em}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:rgba(111,191,115,.22)}
.now{background:var(--sun);color:#0F161D}
.sel{box-shadow:0 2px 0 var(--wind)}
.hint{font-size:.85rem;color:var(--muted);line-height:1.4}
#sources,.box{margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
#sources{font-size:.95rem;color:var(--muted)} #sources a{color:var(--wind)}
details.box>summary{border:0;padding:0;background:none;font-size:1.25rem;font-weight:700}
#quiz{margin-top:14px}
.term{background:var(--card);border-left:5px solid var(--sun);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0;display:grid;font-size:.95rem;line-height:1.5}
.term span{color:var(--muted)} .es{display:none;color:var(--wind)!important;font-weight:600}
.es-on .es{display:block}
.b{padding:10px 16px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;min-height:44px}
.b.alt{background:transparent;color:var(--ink)}
fieldset{border:0;padding:0;margin:0 0 22px} legend{font-weight:600;margin-bottom:6px;padding:0}
label{display:block;padding:10px 12px;margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:1rem;line-height:1.4}
input[type=radio]{margin-right:8px;accent-color:var(--wind)}
.fb{font-size:.92rem;margin:4px 0 0}.good{color:var(--ok)}.wrong{color:var(--bad)}
#score{font:700 1.2rem "Bricolage Grotesque",sans-serif;margin-top:14px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;gap:10px;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.player .b{flex:1;max-width:220px}
.sheet{position:fixed;z-index:8;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));max-height:46vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.35);font-size:1rem;line-height:1.5}
.sheet[hidden]{display:none}
.sh{display:flex;align-items:baseline;gap:10px}
.sh strong{font:800 1.4rem "Bricolage Grotesque",sans-serif;color:var(--ink)}
.sh .ipa{color:var(--wind)} .sp{flex:1}
.sh button{border:1px solid var(--line);background:transparent;border-radius:8px;width:38px;height:34px;font-size:1.1rem}
.sheet.min #pbody{display:none}
.tr{margin:2px 0 0;font-style:italic;color:var(--wind);font-size:1.08rem}
.tr[hidden]{display:none}
.pos{font:700 .8rem "Bricolage Grotesque",sans-serif;color:var(--muted);margin:10px 0 0}
.def{margin:2px 0}.ex{margin:2px 0;font-size:.9rem;color:var(--muted);font-style:italic}
.mini{margin-top:10px;padding:8px 12px;border:2px solid var(--ink);border-radius:8px;background:transparent;font-weight:700;font-size:.9rem}
@media (min-width:900px){.sheet{left:auto;right:20px;width:370px}}
</style>
</head>
<body>
<header class="top">
  <span class="brand"><img class="logo" src="icon-192.png" alt="" width="38" height="38">Juanes’s Topics</span>
  <button id="theme" type="button" aria-label="Switch light or dark mode"></button>
</header>
<nav class="pick" aria-label="Topics">
  <details id="topics"><summary>Select your topic to learn today</summary><div class="dd" id="list"></div></details>
  <details id="others"><summary>Other topics</summary><div class="dd" id="list2"></div></details>
</nav>

<main>
  <h1 id="title"></h1>
  <article id="text"></article>
  <p class="hint">Tap any word to see its meaning and pronunciation.</p>
  <section id="sources"><h2>Sources</h2><div id="srcbody"></div></section>

  <details class="box" id="vocabBox">
    <summary>Key vocabulary</summary>
    <p><button class="b alt" id="toggleEs" type="button">Mostrar español</button></p>
    <div id="vocab"></div>
  </details>

  <details class="box" id="quizBox">
    <summary>Quiz</summary>
    <form id="quiz"></form>
    <button class="b" id="check" type="button">Check answers</button>
    <button class="b alt" id="reset" type="button">Try again</button>
    <div id="score" aria-live="polite"></div>
  </details>
</main>

<aside class="sheet" id="panel" hidden aria-live="polite">
  <div class="sh"><strong id="pw"></strong><span class="ipa" id="pipa"></span><span class="sp"></span>
    <button id="pmin" type="button" aria-label="Minimize">–</button>
    <button id="pclose" type="button" aria-label="Close">✕</button></div>
  <p class="tr" id="ptr" hidden></p>
  <div id="pbody"></div>
</aside>

<div class="player">
  <button class="b" id="pp" type="button">▶ Listen</button>
  <button class="b alt" id="stopb" type="button">■ Stop</button>
</div>

<script>
const LESSONS = {"solar": {"title": "Why solar power is now big business", "group": "Energy markets and renewables", "paras": ["Twenty years ago, solar panels were expensive and mostly used for small projects, such as powering a calculator or a house in a remote area. Today, they are one of the cheapest ways to produce electricity in many countries. The cost of solar panels has fallen sharply, and this change has attracted investors, governments and large companies.", "Most solar projects follow a similar model. A developer finds land, gets the necessary permits, and builds a solar farm. Then it signs a power purchase agreement, or PPA, with a buyer. In a PPA, the buyer agrees to purchase the electricity at a fixed price for many years, often between 10 and 25 years. This gives the developer a stable income and makes it easier to get a bank loan.", "However, solar energy has a challenge: the sun does not shine at night. Because of this, the electricity grid must balance supply and demand at every moment. Batteries can store extra energy during the day and release it in the evening, when demand is high. For this reason, many new projects combine solar panels with storage.", "For businesses, renewable energy is not only about the environment. Many companies install solar panels to reduce their electricity bills and protect themselves from price increases. Others buy renewable energy to meet their sustainability goals. As a result, professionals who understand both energy and finance are increasingly in demand."], "vocab": [{"w": "solar farm", "d": "a large area of solar panels that sends electricity to the grid", "es": "granja solar"}, {"w": "investor", "d": "a person or company that puts money into a project to make a profit", "es": "inversionista"}, {"w": "permit", "d": "an official document that gives you permission to do something", "es": "permiso, licencia"}, {"w": "PPA (power purchase agreement)", "d": "a long contract to buy electricity at an agreed price", "es": "contrato de compra de energía"}, {"w": "grid", "d": "the network of cables that carries electricity to homes and businesses", "es": "red eléctrica"}, {"w": "storage", "d": "keeping energy, for example in batteries, to use it later", "es": "almacenamiento"}, {"w": "bill", "d": "a document that shows how much money you must pay for a service", "es": "factura"}, {"w": "in demand", "d": "wanted by many people or companies", "es": "muy solicitado"}], "quiz": [{"q": "What has happened to the cost of solar panels?", "o": ["It has risen.", "It has fallen sharply.", "It has stayed the same."], "a": 1, "why": "The text says the cost has fallen sharply."}, {"q": "What is a PPA?", "o": ["A permit to build a solar farm", "A long contract to buy electricity at a fixed price", "A type of battery"], "a": 1, "why": "In a PPA, the buyer agrees to purchase electricity at a fixed price for many years."}, {"q": "Why is a PPA useful for the developer?", "o": ["It gives a stable income and helps to get a loan.", "It removes the need for permits.", "It makes the panels cheaper."], "a": 0, "why": "A stable income makes it easier to get a bank loan."}, {"q": "Why do many new projects include batteries?", "o": ["Because panels do not work in summer", "To store energy for the evening, when demand is high", "To make the grid smaller"], "a": 1, "why": "Batteries store extra energy during the day and release it in the evening."}, {"q": "Complete the sentence: Many companies install solar panels ___ reduce their electricity bills.", "o": ["to", "for", "by"], "a": 0, "why": "We use “to + verb” to express purpose."}], "sources": [], "note": "Practice text written for this blog. It has no external sources."}, "wind": {"title": "How wind farms make money", "group": "Energy markets and renewables", "paras": ["Wind energy is another fast-growing source of renewable power. Wind turbines turn the movement of the air into electricity. The best locations are usually windy places, such as coastlines, mountains and open plains, and increasingly the sea. Offshore wind farms, built in the ocean, can produce more electricity because the wind there is stronger and more constant.", "Building a wind farm is a long and expensive process. A company must measure the wind for months, or even years, to be sure that the site is suitable. Then it needs permits, financing and a connection to the grid. The turbines are enormous: some blades are almost as long as a football field. Because of the high initial cost, wind projects often depend on long-term contracts and government support, such as auctions in which companies compete to sell electricity at the lowest price.", "Once a wind farm is operating, its costs are low because the wind is free. The main expenses are maintenance and insurance. The company earns money by selling electricity to the grid, and the amount depends on the wind speed. On a calm day, the turbines produce very little. On a stormy day, they stop to protect themselves.", "For this reason, wind farm owners study weather forecasts carefully to plan their sales. Many experts also believe that wind and solar energy work well together. In many regions, the wind blows more at night and in winter, when solar output is lower. By combining both sources, an electricity utility can supply more reliable power to its customers."], "vocab": [{"w": "wind turbine", "d": "a tall machine with large blades that turns wind into electricity", "es": "aerogenerador, turbina eólica"}, {"w": "offshore", "d": "in the sea, not on land", "es": "mar adentro, en el mar"}, {"w": "blade", "d": "one of the long, flat parts of a turbine that turn in the wind", "es": "aspa, pala"}, {"w": "auction", "d": "a competition in which companies make offers and the best offer wins", "es": "subasta"}, {"w": "maintenance", "d": "regular work to keep a machine in good condition", "es": "mantenimiento"}, {"w": "insurance", "d": "an agreement in which you pay money to be protected against loss or damage", "es": "seguro"}, {"w": "forecast", "d": "a prediction about what will happen, for example with the weather", "es": "pronóstico"}, {"w": "utility", "d": "a company that supplies electricity, gas or water to customers", "es": "empresa de servicios públicos"}], "quiz": [{"q": "Why can offshore wind farms produce more electricity?", "o": ["The turbines are smaller.", "The wind is stronger and more constant.", "They do not need maintenance."], "a": 1, "why": "The text says the wind at sea is stronger and more constant."}, {"q": "Why do many wind projects depend on long-term contracts or government support?", "o": ["Because the initial cost is high", "Because the wind is not free", "Because turbines are very small"], "a": 0, "why": "The high initial cost makes long-term contracts and support important."}, {"q": "What are the main costs of an operating wind farm?", "o": ["Fuel and transport", "Maintenance and insurance", "Land and permits"], "a": 1, "why": "Once it is operating, the main expenses are maintenance and insurance."}, {"q": "What happens to the turbines on a stormy day?", "o": ["They produce more power.", "They stop to protect themselves.", "They change direction."], "a": 1, "why": "In a storm, the turbines stop to protect themselves."}, {"q": "Complete the sentence: The amount of electricity ___ on the wind speed.", "o": ["depends", "depend", "depending"], "a": 0, "why": "“The amount” is singular, so we use “depends”."}], "sources": [], "note": "Practice text written for this blog. It has no external sources."}};
let D = LESSONS;
const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur, spans = [], starts = [], FULL = '', last = -1, selEl = null, st = 'idle', idx = 0, timer = null, cu = null;

/* ---------- theme ---------- */
const root = document.documentElement;
function setTheme(t){ root.dataset.theme = t; $('theme').textContent = t === 'dark' ? '☀' : '🌙'; try { localStorage.setItem('theme', t); } catch (e) {} }
let saved = null; try { saved = localStorage.getItem('theme'); } catch (e) {}
setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');

/* ---------- topics ---------- */
function dayLabel(d){
  const loc = x => new Date(x.getTime() - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  if (d === loc(new Date())) return 'Today';
  if (d === loc(new Date(Date.now() - 864e5))) return 'Yesterday';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', {day: 'numeric', month: 'short'});
}
function buildList(){
  const ks = Object.keys(D), latest = ks.map(k => D[k].date || '').sort().pop();
  let day = ks.filter(k => D[k].date && D[k].date === latest), rest = ks.filter(k => !day.includes(k));
  if (!day.length) { day = ks; rest = []; }
  const item = k => `<button class="topic" data-k="${esc(k)}" type="button">${esc(D[k].title)}<small>${esc(D[k].group)}${D[k].kind ? ' · ' + (D[k].kind === 'news' ? 'news' : 'paper') : ''}</small></button>`;
  const grouped = arr => { const g = {}; arr.forEach(k => (g[D[k].grp] = g[D[k].grp] || []).push(k));
    return Object.entries(g).map(([n, a]) => `<p class="grp">${esc(n)}</p>` + a.map(item).join('')).join(''); };
  $('list').innerHTML = grouped(day); $('list2').innerHTML = grouped(rest); $('others').hidden = !rest.length;
  document.querySelectorAll('.dd .topic').forEach(b => {
    b.setAttribute('aria-current', D[b.dataset.k] === cur);
    b.onclick = () => { load(b.dataset.k); $('topics').open = false; $('others').open = false; };
  });
}

/* ---------- load a lesson ---------- */
function load(k){
  stopAll(); cur = D[k]; spans = []; starts = []; selEl = null; last = -1;
  $('title').textContent = cur.title; $('vocabBox').open = false; $('quizBox').open = false; $('panel').hidden = true;
  const art = $('text'); art.innerHTML = ''; let pos = 0;
  cur.paras.forEach(p => {
    const el = document.createElement('p');
    p.split(' ').forEach((tok, i, a) => {
      const s = document.createElement('span');
      s.className = 'w'; s.textContent = tok; s.tabIndex = 0;
      spans.push(s); starts.push(pos); pos += tok.length + 1;
      el.appendChild(s); if (i < a.length - 1) el.appendChild(document.createTextNode(' '));
    });
    art.appendChild(el);
  });
  FULL = cur.paras.join('\n');
  $('srcbody').innerHTML = cur.sources.length
    ? '<p>' + (cur.kind === 'news' ? 'Based on a news article:' : cur.kind === 'paper' ? 'Based on a research paper:' : 'Sources:') + '</p>' +
      cur.sources.map(x => `<p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><br>${esc([x.publisher, x.date].filter(Boolean).join(' · '))}</p>`).join('') +
      '<p class="hint">Summary written with AI from the source above. Read the original for the full details.</p>'
    : `<p>${esc(cur.note)}</p>`;
  $('vocabBox').hidden = !cur.vocab.length; $('vocab').classList.remove('es-on'); $('toggleEs').textContent = 'Mostrar español';
  $('vocab').innerHTML = cur.vocab.map(v => `<div class="term"><b>${esc(v.w)}</b><span>${esc(v.d)}</span><span class="es">${esc(v.es)}</span></div>`).join('');
  $('quizBox').hidden = !cur.quiz.length; $('score').textContent = '';
  $('quiz').innerHTML = cur.quiz.map((it, i) => `<fieldset><legend>${i + 1}. ${esc(it.q)}</legend>` +
    it.o.map((t, j) => `<label><input type="radio" name="q${i}" value="${j}">${esc(t)}</label>`).join('') + `<p class="fb" id="fb${i}"></p></fieldset>`).join('');
  document.querySelectorAll('.dd .topic').forEach(b => b.setAttribute('aria-current', D[b.dataset.k] === cur));
  window.scrollTo(0, 0); prepAudio();
}
$('toggleEs').onclick = () => { const on = $('vocab').classList.toggle('es-on'); $('toggleEs').textContent = on ? 'Ocultar español' : 'Mostrar español'; };

/* ---------- quiz ---------- */
$('check').onclick = () => {
  let n = 0;
  cur.quiz.forEach((it, i) => {
    const c = document.querySelector(`input[name=q${i}]:checked`), fb = $('fb' + i);
    if (!c) { fb.textContent = 'Choose an answer.'; fb.className = 'fb wrong'; return; }
    const ok = +c.value === it.a; if (ok) n++;
    fb.textContent = (ok ? 'Correct. ' : 'Not quite. ') + it.why; fb.className = 'fb ' + (ok ? 'good' : 'wrong');
  });
  $('score').textContent = `Score: ${n} / ${cur.quiz.length}`;
};
$('reset').onclick = () => { $('quiz').reset(); document.querySelectorAll('.fb').forEach(e => { e.textContent = ''; e.className = 'fb'; }); $('score').textContent = ''; };

/* ---------- pre-recorded audio with exact word timings ---------- */
const AU = new Audio(); AU.preload = 'auto';
let useAudio = false, timing = [], raf = 0, tok = 0;
function tick(){
  const ms = AU.currentTime * 1000;
  if (timing.length && timing[0][0] <= ms) {
    let lo = 0, hi = timing.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (timing[m][0] <= ms) lo = m; else hi = m - 1; }
    idx = at(timing[lo][1]); mark(idx);
  }
  raf = requestAnimationFrame(tick);
}
AU.onplay = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); };
AU.onpause = () => cancelAnimationFrame(raf);
AU.onended = () => { cancelAnimationFrame(raf); st = 'idle'; idx = 0; mark(-1); btn(); };
AU.onerror = () => { useAudio = false; };
async function prepAudio(){
  const my = ++tok; useAudio = false; timing = [];
  if (!cur.audio) return;
  try {
    const r = await fetch(cur.audio.replace(/\.mp3$/, '.json'));
    if (!r.ok) return;
    const t = await r.json();
    if (my !== tok) return;
    timing = t; AU.src = cur.audio; useAudio = true;
  } catch (e) {}
}

/* ---------- audio: play / pause / resume / stop ---------- */
const at = ci => { let lo = 0, hi = starts.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (starts[m] <= ci) lo = m; else hi = m - 1; } return lo; };
function mark(i){
  if (last >= 0) spans[last].classList.remove('now');
  last = i; if (i < 0) return;
  const s = spans[i]; s.classList.add('now');
  const r = s.getBoundingClientRect();
  if (r.bottom > innerHeight - 170 || r.top < 90) s.scrollIntoView({block: 'center', behavior: 'smooth'});
}
function btn(){ $('pp').textContent = st === 'playing' ? '⏸ Pause' : st === 'paused' ? '▶ Resume' : '▶ Listen'; }
function halt(){ cu = null; clearInterval(timer); if (synth) synth.cancel(); AU.pause(); }
function stopAll(){ halt(); try { AU.currentTime = 0; } catch (e) {} st = 'idle'; idx = 0; mark(-1); btn(); }
function pickVoice(){
  const en = synth.getVoices().filter(v => v.lang.startsWith('en'));
  return en.find(v => v.localService && v.lang === 'en-US') || en.find(v => v.localService) || null;
}
function speak(from){
  halt();
  const base = starts[from], u = new SpeechSynthesisUtterance(FULL.slice(base));
  u.lang = 'en-US'; u.rate = 0.83;
  const v = pickVoice(); if (v) u.voice = v;
  let exact = false; cu = u;
  u.onboundary = e => { if (e.name && e.name !== 'word') return; exact = true; clearInterval(timer); idx = at(base + e.charIndex); mark(idx); };
  u.onstart = () => {
    const t0 = Date.now(), mpc = 68 / u.rate;
    setTimeout(() => { if (exact || cu !== u) return; timer = setInterval(() => { idx = at(base + (Date.now() - t0) / mpc); mark(idx); }, 120); }, 1200);
  };
  const done = () => { if (cu === u) { halt(); st = 'idle'; idx = 0; mark(-1); btn(); } };
  u.onend = done; u.onerror = done;
  synth.speak(u);
}
$('pp').onclick = () => {
  if (st === 'playing') { halt(); st = 'paused'; }
  else if (useAudio) {
    const p = AU.play(); if (p && p.catch) p.catch(() => { useAudio = false; st = 'idle'; btn(); });
    st = 'playing';
  } else {
    if (!synth) { alert('Your browser does not support audio.'); return; }
    speak(st === 'paused' ? idx : 0); st = 'playing';
  }
  btn();
};
$('stopb').onclick = stopAll;

/* ---------- dictionary panel ---------- */
const P = $('panel');
$('pclose').onclick = () => { P.hidden = true; };
$('pmin').onclick = () => { const m = P.classList.toggle('min'); $('pmin').textContent = m ? '+' : '–'; };
function pick(el){
  if (!el.classList.contains('w')) return;
  if (selEl) selEl.classList.remove('sel');
  selEl = el; el.classList.add('sel'); lookup(el.textContent);
}
$('text').addEventListener('click', e => pick(e.target));
$('text').addEventListener('keydown', e => { if (e.key === 'Enter') pick(e.target); });

function trOf(w){
  const g = cur.gloss || {}, v = (cur.vocab || []).find(x => x.w.toLowerCase() === w);
  return [w, w.replace(/ies$/, 'y'), w.replace(/(es|s)$/, ''), w.replace(/(ing|ed)$/, '')].map(t => g[t]).find(Boolean) || (v ? v.es : '');
}
async function lookup(raw){
  const w = raw.replace(/[^A-Za-z'-]/g, '').toLowerCase();
  if (!w) return;
  P.hidden = false; P.classList.remove('min'); $('pmin').textContent = '–';
  $('pw').textContent = w; $('pipa').textContent = ''; $('pbody').innerHTML = '<p class="hint">Looking up…</p>';
  const tr = trOf(w); $('ptr').textContent = tr; $('ptr').hidden = !tr;
  const tries = [...new Set([w, w.replace(/ies$/, 'y'), w.replace(/(es|s)$/, ''), w.replace(/(ing|ed)$/, '')])];
  for (const t of tries) {
    try {
      const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(t));
      if (!r.ok) continue;
      const d = (await r.json())[0];
      $('pw').textContent = d.word;
      $('pipa').textContent = d.phonetic || ((d.phonetics || []).find(p => p.text) || {}).text || '';
      let h = '';
      (d.meanings || []).slice(0, 2).forEach(m => {
        const df = m.definitions[0];
        h += `<p class="pos">${esc(m.partOfSpeech)}</p><p class="def">${esc(df.definition)}</p>` + (df.example ? `<p class="ex">${esc(df.example)}</p>` : '');
      });
      $('pbody').innerHTML = h + '<button class="mini" id="say" type="button">🔊 Hear the word</button>';
      $('say').onclick = () => { if (!synth) return; const was = st; if (was === 'playing') { halt(); st = 'paused'; btn(); } const u = new SpeechSynthesisUtterance(d.word); u.lang = 'en-US'; synth.speak(u); };
      return;
    } catch (err) {}
  }
  $('pbody').innerHTML = '<p class="hint">No definition found. Try another word.</p>';
}

let fetchedAt = 0;
async function fetchArticles(){
  let arts = null;
  try {
    const r = await fetch('data/articles.json', {cache: 'no-cache'});
    if (r.ok) arts = (await r.json()).articles || [];
  } catch (e) {}
  if (arts === null) return;
  const A = {};
  arts.forEach(x => { A[x.id] = {title: x.title, group: x.group, date: x.date, grp: dayLabel(x.date), kind: x.kind, paras: x.paras || [],
    vocab: x.vocab || [], quiz: x.quiz || [], gloss: x.gloss || {}, audio: x.audio || '', sources: x.sources || [], note: ''}; });
  D = {...A, ...LESSONS}; fetchedAt = Date.now(); buildList();
}
async function init(){
  Object.values(LESSONS).forEach(l => l.grp = 'Practice lessons');
  await fetchArticles(); buildList();
  load(Object.keys(D)[0]);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - fetchedAt > 15 * 60e3) fetchArticles(); });
['topics', 'others'].forEach(id => $(id).addEventListener('toggle', e => { if (e.target.open) $(id === 'topics' ? 'others' : 'topics').open = false; }));
['vocabBox', 'quizBox'].forEach(id => $(id).addEventListener('toggle', e => {
  if (e.target.open) ['vocabBox', 'quizBox'].filter(x => x !== id).forEach(x => { $(x).open = false; });
}));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
init();
</script>
